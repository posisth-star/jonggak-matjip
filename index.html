<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>종로 맛집</title>
  <meta name="description" content="알파빌딩(서울 종로구 종로 34)에서 도보 20분 안 맛집을 종류별 카카오 추천순으로.">
  <!-- 카톡 등 링크 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="종로 맛집">
  <meta property="og:title" content="알파빌딩에서 도보 20분 맛집">
  <meta property="og:description" content="종로·광화문·을지로 점심 맛집을 종류별 카카오 추천순으로 모아 봤어요.">
  <meta property="og:url" content="https://posisth-star.github.io/jonggak-matjip/">
  <meta property="og:image" content="https://posisth-star.github.io/jonggak-matjip/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>알파빌딩에서 도보 20분 맛집</h1>
    <p class="lead">출발지 서울 종로구 종로 34 알파빌딩 · 카카오 추천순 · 리뷰는 네이버·카카오에서 확인하세요.</p>
  </header>
  <nav id="tabs" role="tablist" aria-label="음식 종류"></nav>
  <div class="controls">
    <label>정렬
      <select id="sortBy">
        <option value="rank">추천순</option>
        <option value="distance">가까운 순</option>
        <option value="name">이름순</option>
      </select>
    </label>
    <label>거리
      <select id="maxWalk">
        <option value="0">도보 20분 이내</option>
        <option value="5">도보 5분 이내</option>
        <option value="10">도보 10분 이내</option>
        <option value="15">도보 15분 이내</option>
      </select>
    </label>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer id="footer">장소 정보: 카카오맵 · 도보 시간은 직선거리 기준 추정치예요.</footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
